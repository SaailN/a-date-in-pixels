<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Date in pixels </title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#150b27; --plum:#2a1646; --mulberry:#4a2570;
  --rose:#f0a9b8; --champagne:#f8e2bd; --tomato:#e2573a; --sea:#2a8aa0; --ink:#fff7ee;
  --display:'Cormorant Garamond',Georgia,serif;
  --body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:20}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;user-select:none;-webkit-user-select:none}

.glass{background:rgba(24,12,44,.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(248,226,189,.2);border-radius:20px;box-shadow:0 18px 50px rgba(8,2,20,.45)}
.btn{font:700 15px/1 var(--body);border:0;border-radius:999px;padding:13px 20px;background:var(--champagne);color:var(--night);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease,background .15s ease,opacity .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(248,226,189,.35)}
.btn.ghost.sel{background:var(--rose);color:var(--night);border-color:var(--rose)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.btn.big{padding:17px 30px;font-size:17px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.5)}

/* top bar */
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:6;pointer-events:none}
#top>*{pointer-events:auto}
.spacer{flex:1}
.chip{font:700 14px/1 var(--body);color:var(--ink);background:rgba(24,12,44,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(248,226,189,.25);border-radius:999px;padding:10px 14px;cursor:pointer}
#wtitle{font-family:var(--display);font-style:italic;font-weight:600;font-size:24px;color:var(--champagne);text-shadow:0 2px 14px rgba(0,0,0,.6)}
#stats{font-size:13px;color:var(--champagne);opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* hub prompt + game panel */
#prompt,#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(580px,calc(100vw - 24px));padding:16px 20px;z-index:6}
#prompt h3,#panel h3{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;color:var(--champagne)}
#prompt p,#panel p{margin:0 0 12px;font-size:15px;line-height:1.45;color:rgba(255,247,238,.88);max-width:62ch}
#prompt p:last-child,#panel p:last-child{margin-bottom:0}
#gBtns{display:flex;flex-wrap:wrap;gap:8px}
#gBtns:empty{display:none}
#bar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.12);margin:2px 0 12px;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--rose),var(--champagne));border-radius:99px;transition:width .12s linear}
#zone{position:absolute;left:55%;width:25%;top:0;bottom:0;background:rgba(255,214,102,.45);border-left:2px solid #ffd666;border-right:2px solid #ffd666}

/* joystick */
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:128px;height:128px;border-radius:50%;background:rgba(24,12,44,.45);border:1px solid rgba(248,226,189,.3);z-index:5;touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:54px;height:54px;border-radius:50%;background:rgba(248,226,189,.85);box-shadow:0 4px 16px rgba(0,0,0,.4)}
body[data-world="hub"] #prompt:not([hidden]) ~ #joy{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;z-index:9;background:rgba(248,226,189,.96);color:var(--night);font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;transition:opacity .25s ease,transform .25s ease;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* card */
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 28px));padding:26px 26px 22px;z-index:8;animation:cardIn .5s ease both}
#card.bottom{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%)}
#card h2{margin:0 0 10px;font-family:var(--display);font-weight:600;font-style:italic;font-size:clamp(30px,6vw,42px);line-height:1.05;color:var(--champagne)}
#cX p{margin:0 0 10px;font-size:16px;line-height:1.5;color:rgba(255,247,238,.92)}
#cB{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@keyframes cardIn{from{opacity:0;margin-top:12px}to{opacity:1;margin-top:0}}

/* intro */
#intro{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 40px);background:linear-gradient(to top,rgba(21,11,39,.94) 0%,rgba(21,11,39,.55) 45%,rgba(21,11,39,.15) 100%);transition:opacity 1s ease,visibility 1s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.introInner{max-width:560px}
#intro h1{margin:0 0 6px;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(60px,15vw,128px);line-height:.92;letter-spacing:-.015em;color:var(--champagne);text-shadow:0 4px 40px rgba(240,169,184,.35)}
#intro .lede{margin:0 0 26px;font-size:18px;line-height:1.45;color:rgba(255,247,238,.9);max-width:34ch}
#intro label{display:block;font-size:14px;margin-bottom:8px;color:var(--rose);font-weight:700}
#nameIn{width:min(340px,100%);display:block;margin-bottom:16px;font:600 18px var(--body);color:var(--ink);background:rgba(255,255,255,.09);border:1px solid rgba(248,226,189,.4);border-radius:14px;padding:14px 16px}
#nameIn::placeholder{color:rgba(255,247,238,.5)}
@media (prefers-reduced-motion:reduce){#card{animation:none}.btn,#toast{transition:none}}
</style>
</head>
<body data-world="hub">
<canvas id="c" tabindex="0" aria-label="3D journey world"></canvas>

<div id="top" hidden>
  <button id="back" class="chip" hidden>‹ Journey</button>
  <div id="wtitle">A Date in pixels </div>
  <div class="spacer"></div>
  <span id="stats"></span>
  <button id="mute" class="chip" aria-label="Toggle sound">♪</button>
  <button id="reset" class="chip" aria-label="Reset progress" title="Reset progress">↺</button>
</div>

<div id="prompt" class="glass" hidden>
  <h3 id="pt"></h3>
  <p id="px"></p>
  <button id="pb" class="btn" type="button"></button>
</div>

<div id="panel" class="glass" hidden>
  <h3 id="gTitle"></h3>
  <p id="gText"></p>
  <div id="bar"><i id="fill"></i><b id="zone"></b></div>
  <div id="gBtns"></div>
</div>

<div id="joy" hidden><i id="knob"></i></div>
<div id="toast" role="status"></div>
<div id="card" class="glass" hidden><h2 id="cT"></h2><div id="cX"></div><div id="cB"></div></div>

<div id="intro">
  <div class="introInner">
    <h1>A Date in pixels </h1>
    <p class="lede">Every date becomes a little world you can walk into.</p>
    <label for="nameIn">What should I call you?</label>
    <input id="nameIn" maxlength="24" placeholder="Your name, princess" autocomplete="given-name">
    <button id="begin" class="btn big" type="button">Begin the journey</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   EDIT THESE WORDS to make the journey yours
   ===================================================================== */
var WORDS = {
  date1:  { name:'Date 1 · The café',  blurb:'Where it began: a café table and a game of Connect 4.' },
  date2:  { name:'Date 2 · Pizza night', blurb:'Hand-rolled pizza and an almond chocolate dessert, made just for you.' },
  date3:  { name:'Date 3', blurb:'Chapter three is still a secret. Coming soon.' },
  finalLocked: 'Finish Date 1 and Date 2 to see what is waiting at the end of this path.',
  finalTitle: 'Someday, a view like this',
  finalLines: [
    'Every princess deserves a home that looks out over the sea.',
    'A flat in Mumbai, the sun going down over the water, and you on the balcony.',
    'I’m not there yet, but every date on this journey is one step closer. More chapters are coming.'
  ]
};

/* ---------- tiny helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
var rand = function(a,b){ return a + Math.random()*(b-a); };
var clamp = function(v,a,b){ return Math.max(a,Math.min(b,v)); };
var lerp = function(a,b,t){ return a+(b-a)*t; };
var ease = function(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; };
var V3 = function(x,y,z){ return new THREE.Vector3(x,y,z); };
var PI = Math.PI;
function seeded(seed){ var s=seed; return function(){ s=(s*16807)%2147483647; return s/2147483647; }; }

/* ---------- saved progress ---------- */
var state = { name:'', done:{cafe:false,pizza:false}, muted:false };
try{
  var saved = JSON.parse(localStorage.getItem('ourJourney')||'null');
  if(saved){ state.name=saved.name||''; state.done=Object.assign(state.done,saved.done||{}); state.muted=!!saved.muted; }
}catch(e){}
function save(){ try{ localStorage.setItem('ourJourney',JSON.stringify(state)); }catch(e){} }
function herName(){ return state.name || 'Princess'; }
function unlocked(){ return state.done.cafe && state.done.pizza; }

/* ---------- sound (small synthesized tones, no files) ---------- */
var actx=null;
function audio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function tone(f,d,type,v,delay){
  if(state.muted) return; var a=audio(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+(delay||0);
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v||.08,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+(d||.15));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+(d||.15)+.05);
}
var sfx = {
  pop:function(){ tone(540,.09,'triangle',.07); },
  drop:function(){ tone(190,.13,'sine',.11); },
  tap:function(){ tone(330,.08,'square',.03); },
  place:function(){ tone(700,.07,'triangle',.05); },
  chime:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.55,'sine',.07,i*.12); }); },
  oops:function(){ tone(150,.3,'sawtooth',.05); }
};

/* ---------- three.js basics ---------- */
var canvas = $('#c');
var renderer = new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var ray = new THREE.Raycaster();
var mouse = new THREE.Vector2();
function setMouse(e){
  var r=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
}
function pickPlane(cam,y,e){
  setMouse(e); ray.setFromCamera(mouse,cam);
  var p=new THREE.Vector3();
  return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),p) ? p : null;
}

var M = function(color,o){ return new THREE.MeshStandardMaterial(Object.assign({color:color,roughness:.75,metalness:0},o||{})); };
var BM = function(color,o){ return new THREE.MeshBasicMaterial(Object.assign({color:color},o||{})); };
var mesh = function(geo,mat,x,y,z){ var m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); return m; };
var Bx = function(w,h,d){ return new THREE.BoxGeometry(w,h,d); };
var Cy = function(rt,rb,h,s){ return new THREE.CylinderGeometry(rt,rb,h,s||24); };
var Sp = function(r,ws,hs){ return new THREE.SphereGeometry(r,ws||20,hs||14); };
var INVIS = function(){ return new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}); };

function canvasTex(w,h,draw){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var g=c.getContext('2d'); draw(g,w,h);
  var t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
var heartTex = canvasTex(64,64,function(g){
  g.fillStyle='#fff'; g.beginPath(); g.moveTo(32,56);
  g.bezierCurveTo(4,36,6,10,24,10); g.bezierCurveTo(30,10,32,16,32,18);
  g.bezierCurveTo(32,16,34,10,40,10); g.bezierCurveTo(58,10,60,36,32,56); g.fill();
});
var glowTex = canvasTex(128,128,function(g,w,h){
  var r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.3,'rgba(255,255,255,.45)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,w,h);
});
function starPath(g,cx,cy,R,r,n){
  g.beginPath();
  for(var i=0;i<n*2;i++){ var rad=i%2?r:R, a=-PI/2+i*PI/n; g.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad); }
  g.closePath();
}
var sparkTex = canvasTex(64,64,function(g,w,h){
  var r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.25,'rgba(255,255,255,.7)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,w,h);
});
var goldStarTex = canvasTex(128,128,function(g){
  g.fillStyle='#ffd36b'; g.strokeStyle='#fff2c2'; g.lineWidth=5; g.lineJoin='round';
  starPath(g,64,66,54,24,5); g.fill(); g.stroke();
});

function makeSky(stops){
  var tex=canvasTex(4,512,function(g,w,h){
    var gr=g.createLinearGradient(0,0,0,h);
    stops.forEach(function(s){ gr.addColorStop(s[0],s[1]); });
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  });
  var m=new THREE.Mesh(new THREE.SphereGeometry(500,32,24),new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,fog:false,depthWrite:false}));
  m.renderOrder=-10; return m;
}
function makeStars(n,rad,minY){
  var pos=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    var u=Math.random()*2*PI, y=minY+Math.random()*(1-minY), r=Math.sqrt(1-y*y);
    pos[i*3]=Math.cos(u)*r*rad; pos[i*3+1]=y*rad; pos[i*3+2]=Math.sin(u)*r*rad;
  }
  var g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var p=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:5,map:sparkTex,transparent:true,depthWrite:false,sizeAttenuation:false,fog:false}));
  p.renderOrder=-9; return p;
}
function makeDrift(n,cx,cy,cz,bx,by,bz,tex,color,size,speed){
  var pos=new Float32Array(n*3), seed=new Float32Array(n);
  for(var i=0;i<n;i++){ pos[i*3]=cx+rand(-bx,bx); pos[i*3+1]=cy+rand(0,by); pos[i*3+2]=cz+rand(-bz,bz); seed[i]=rand(0,100); }
  var g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var pts=new THREE.Points(g,new THREE.PointsMaterial({color:color,size:size,map:tex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  pts.frustumCulled=false;
  pts.userData.update=function(dt,t){
    for(var i=0;i<n;i++){
      pos[i*3+1]+=speed*dt*(.6+(seed[i]%1));
      pos[i*3]+=Math.sin(t*.6+seed[i])*.25*dt;
      if(pos[i*3+1]>cy+by){ pos[i*3+1]=cy; }
    }
    g.attributes.position.needsUpdate=true;
  };
  return pts;
}

/* floating text labels */
var labelList=[];
function rr(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function makeLabel(w3,main,sub,hasSub){
  var cw=640, ch=hasSub?230:140;
  var c=document.createElement('canvas'); c.width=cw; c.height=ch;
  var g=c.getContext('2d'), tex=new THREE.CanvasTexture(c);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(w3,w3*ch/cw,1);
  var o={main:main,sub:sub};
  function draw(){
    g.clearRect(0,0,cw,ch);
    g.fillStyle='rgba(30,14,54,.82)'; rr(g,6,6,cw-12,ch-12,34); g.fill();
    g.strokeStyle='rgba(248,226,189,.7)'; g.lineWidth=3; g.stroke();
    g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle='#f8e2bd'; g.font='italic 600 '+(hasSub?66:76)+'px "Cormorant Garamond", Georgia, serif';
    g.fillText(o.main,cw/2,hasSub?84:ch/2+2);
    if(hasSub){ g.fillStyle='rgba(255,247,238,.88)'; g.font='600 30px Karla, system-ui, sans-serif'; g.fillText(o.sub||'',cw/2,160); }
    tex.needsUpdate=true;
  }
  sp.userData.set=function(m,s){ o.main=m; o.sub=s; draw(); };
  draw(); labelList.push(draw); return sp;
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ labelList.forEach(function(f){ f(); }); }); }
function emojiSprite(ch,size){
  var t=canvasTex(128,128,function(g){ g.font='96px serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(ch,64,70); });
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
  s.scale.set(size,size,1); return s;
}

/* confetti hearts */
function makeBurst(scene){
  var N=150, geo=new THREE.BufferGeometry();
  var pos=new Float32Array(N*3), col=new Float32Array(N*3), vel=new Float32Array(N*3), life=new Float32Array(N);
  for(var i=0;i<N;i++){ pos[i*3+1]=-9999; }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  var pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.55,map:heartTex,vertexColors:true,transparent:true,depthWrite:false,alphaTest:.05}));
  pts.frustumCulled=false; scene.add(pts);
  var palette=[0xff7aa2,0xffd27a,0xffffff,0xf0a9b8,0xffa24a].map(function(c){ return new THREE.Color(c); });
  return {
    fire:function(x,y,z,spread){
      spread=spread||5;
      for(var i=0;i<N;i++){
        pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
        var a=rand(0,2*PI), s=rand(.3,1)*spread;
        vel[i*3]=Math.cos(a)*s; vel[i*3+1]=rand(2,spread*1.6); vel[i*3+2]=Math.sin(a)*s;
        life[i]=rand(1.4,2.6);
        var c=palette[(Math.random()*palette.length)|0]; col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
      }
      geo.attributes.color.needsUpdate=true;
    },
    update:function(dt){
      for(var i=0;i<N;i++){
        if(life[i]>0){
          life[i]-=dt; vel[i*3+1]-=5*dt;
          pos[i*3]+=vel[i*3]*dt; pos[i*3+1]+=vel[i*3+1]*dt; pos[i*3+2]+=vel[i*3+2]*dt;
          if(life[i]<=0) pos[i*3+1]=-9999;
        }
      }
      geo.attributes.position.needsUpdate=true;
    }
  };
}

/* =====================================================================
   UI plumbing
   ===================================================================== */
var el = {
  intro:$('#intro'), nameIn:$('#nameIn'), begin:$('#begin'),

    var a=NODES[k], b=NODES[k+1], vx=b.x-a.x, vz=b.z-a.z, L2=vx*vx+vz*vz;

  scene.fog=new THREE.Fog(FOGC,140,520);
  var cam=new THREE.PerspectiveCamera(60,1,.1,1400);
  var sky=makeSky([[0,'#120a33'],[.2,'#3d1f6b'],[.34,'#b0407a'],[.44,'#ff8a5b'],[.5,'#ffc58f'],[1,'#ffc58f']]);
  scene.add(sky);
  var stars=makeStars(500,480,.25); stars.material.opacity=.7; scene.add(stars);
  scene.add(new THREE.HemisphereLight(0xffc9a0,0x5a3a6a,.7));
  var sunDir=V3(-.1,.03,-1).normalize();
  var sunL=new THREE.DirectionalLight(0xffb07a,1.3); sunL.position.copy(sunDir.clone().multiplyScalar(100)); scene.add(sunL);
  var sunPos=sunDir.clone().multiplyScalar(420);
  var sunDisc=mesh(new THREE.CircleGeometry(18,48),new THREE.MeshBasicMaterial({color:0xffe9b8,fog:false}),sunPos.x,sunPos.y+10,sunPos.z); scene.add(sunDisc);
  var sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffa860,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  sunGlow.scale.set(300,300,1); sunGlow.position.copy(sunDisc.position); scene.add(sunGlow);

  // sea
  var SEGS=130, seaGeo=new THREE.PlaneGeometry(1000,1000,SEGS,SEGS); seaGeo.rotateX(-PI/2);
  var seaMesh=new THREE.Mesh(seaGeo,new THREE.MeshPhongMaterial({color:0x1d5f86,specular:0xffc890,shininess:70,flatShading:true})); scene.add(seaMesh);
  var sp=seaGeo.attributes.position, baseX=new Float32Array(sp.count), baseZ=new Float32Array(sp.count);
  for(var i=0;i<sp.count;i++){ baseX[i]=sp.getX(i); baseZ[i]=sp.getZ(i); }
  function waves(t){
    for(var i=0;i<sp.count;i++){
      var x=baseX[i], z=baseZ[i];
      sp.setY(i,Math.sin(x*.07+t*1.1)*.9+Math.sin(z*.05+t*.8)*.8+Math.sin((x+z)*.03+t*.5)*1.1);
    }
    sp.needsUpdate=true;
  }
  // city on the left (a nod to Marine Drive), sea link on the right
  var coast=new THREE.CatmullRomCurve3([V3(-120,2,-150),V3(-150,2,-200),V3(-175,2,-260),V3(-185,2,-330),V3(-170,2,-400),V3(-130,2,-450)]);
  var cp=coast.getPoints(90);
  var landShape=new THREE.Shape(); landShape.moveTo(cp[0].x,-cp[0].z);
  cp.forEach(function(p){ landShape.lineTo(p.x,-p.z); });
  landShape.lineTo(-460,-cp[cp.length-1].z); landShape.lineTo(-460,-cp[0].z);
  var landGeo=new THREE.ShapeGeometry(landShape); landGeo.rotateX(-PI/2);
  var land=new THREE.Mesh(landGeo,new THREE.MeshStandardMaterial({color:0x2a1d3e,roughness:1})); land.position.y=2.6; scene.add(land);
  var rnd=seeded(77);
  for(var b=0;b<70;b++){
    var cpt=coast.getPoint(rnd()), w=6+rnd()*10, h=14+rnd()*60;
    var warmB=rnd()<.4;
    var bm=new THREE.MeshStandardMaterial({color:0x2b1f40,emissive:warmB?0x6a3f2a:0x201838,emissiveIntensity:warmB?.55:.3,roughness:.9});
    scene.add(mesh(Bx(w,h,w),bm,cpt.x-6-rnd()*40,2.6+h/2,cpt.z+(rnd()-.5)*18));
  }
  var necklace=coast.getPoints(70), np=new Float32Array(necklace.length*3);
  necklace.forEach(function(p,i){ np[i*3]=p.x+1; np[i*3+1]=4; np[i*3+2]=p.z; });
  var ng=new THREE.BufferGeometry(); ng.setAttribute('position',new THREE.BufferAttribute(np,3));
  scene.add(new THREE.Points(ng,new THREE.PointsMaterial({color:0xffe0a0,size:6,map:sparkTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));
  // bridge
  var bridge=new THREE.Group(); bridge.position.set(180,0,-170); scene.add(bridge);
  var steel=M(0xe8d4c0,{emissive:0x7a4a30,emissiveIntensity:.4});
  bridge.add(mesh(Bx(320,1.4,6),steel,0,10,0));
  [-50,50].forEach(function(x){ bridge.add(mesh(Bx(3,70,3),steel,x,35,0)); });
  var cab=[];
  [-50,50].forEach(function(x){ for(var k=1;k<=10;k++){ [-1,1].forEach(function(sd){ cab.push(x,68,0, x+sd*k*8,10.7,0); }); } });
  var cg=new THREE.BufferGeometry(); cg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(cab),3));
  bridge.add(new THREE.LineSegments(cg,new THREE.LineBasicMaterial({color:0xffd9a0,transparent:true,opacity:.6})));
  // sailboats
  var boats=[];
  for(var bi=0;bi<4;bi++){
    var bg=new THREE.Group();
    bg.add(mesh(Bx(3,.7,1.1),M(0xffffff),0,.3,0));
    var sail=mesh(new THREE.ConeGeometry(1.1,4,3),M(0xfff0d8,{side:THREE.DoubleSide}),0,2.8,0); sail.scale.z=.15; bg.add(sail);
    bg.add(mesh(Cy(.04,.04,4.4,6),M(0x6b4a3a),0,2.5,0));
    bg.position.set(-60+bi*40,.5,-70-bi*22); bg.userData.sp=.6+bi*.15; scene.add(bg); boats.push(bg);
  }

  // balcony
  var FY=18, bal=new THREE.Group(); scene.add(bal);
  var marble=M(0xe9e1d8,{roughness:.35});
  bal.add(mesh(Bx(15,.4,9),marble,0,FY-.2,0));
  bal.add(mesh(Bx(15,.4,9),M(0x2a2232,{roughness:.6}),0,FY+4.9,0));
  [-7.3,7.3].forEach(function(x){ bal.add(mesh(Bx(.4,5,9),M(0xd8cfc6,{roughness:.6}),x,FY+2.4,0)); });
  var glass=mesh(Bx(14.2,1.1,.05),new THREE.MeshStandardMaterial({color:0xcfe8f0,transparent:true,opacity:.16,roughness:.1}),0,FY+.55,-4.3); bal.add(glass);
  bal.add(mesh(Bx(14.2,.07,.12),M(0xcfd5da,{metalness:.8,roughness:.25}),0,FY+1.12,-4.3));
  for(var pi=0;pi<8;pi++){ bal.add(mesh(Bx(.07,1.1,.1),M(0xcfd5da,{metalness:.8,roughness:.25}),-7+pi*2,FY+.55,-4.3)); }
  var tb=new THREE.Group(); tb.position.set(0,FY,-1.4); bal.add(tb);
  tb.add(mesh(Cy(.75,.75,.06,28),M(0x5a3a2a),0,.78,0)); tb.add(mesh(Cy(.07,.07,.78,8),M(0x5a3a2a),0,.39,0)); tb.add(mesh(Cy(.4,.45,.05,20),M(0x5a3a2a),0,.03,0));
  [-1.2,1.2].forEach(function(x){ tb.add(mesh(Bx(.6,.12,.6),M(0xf0a9b8),x,.5,0)); tb.add(mesh(Bx(.6,.7,.08),M(0xf0a9b8),x,.85,x>0?.3:.3)); });
  var candle=mesh(Cy(.04,.04,.28,8),M(0xfff6ee),0,.95,0); tb.add(candle);
  var flame=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffb060,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})); flame.scale.set(.7,.7,1); flame.position.set(0,1.18,0); tb.add(flame);
  var cl=new THREE.PointLight(0xffa860,.9,9); cl.position.set(0,1.3,0); tb.add(cl);
  tb.add(mesh(Cy(.09,.07,.3,12),M(0x8a2a3a),.35,.96,.1)); tb.add(mesh(Sp(.12,10,8),M(0xd02a4a),.35,1.17,.1));
  [-.3,.3].forEach(function(x){ tb.add(mesh(Cy(.07,.04,.2,12),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.35,roughness:.1}),x,.9,-.3)); });
  var bulbs=[];
  for(var s=0;s<2;s++) for(var q=0;q<=20;q++){
    var u=q/20, x=-6.8+u*13.6, y=FY+4.4-Math.sin(u*PI)*.5-s*.0;
    var bs=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffd9a0,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
    bs.scale.set(.35,.35,1); bs.position.set(x,y,-3.6+s*3.6); bal.add(bs); bulbs.push(bs);
  }
  var hearts=makeDrift(40,0,FY,0,9,9,6,heartTex,0xff9fc0,.45,.5); scene.add(hearts);

  var yaw=0, pitch=.02, tYaw=0, tPitch=.02, timer=null;
  function enter(){
    yaw=tYaw=0; pitch=tPitch=.02; el.panel.hidden=true;
    clearTimeout(timer);
    timer=setTimeout(function(){
      if(active!==api) return;
      showCard({title:WORDS.finalTitle,lines:WORDS.finalLines,bottom:true,buttons:[{label:'Back to the journey',primary:true,onClick:function(){ goWorld('hub'); }}]});
      toast('Drag to look around');
    },2400);
  }
  function leave(){ clearTimeout(timer); hideCard(); }
  function onMove(e,p,dx,dy){ if(p.dragged){ tYaw=clamp(tYaw-dx*.004,-1.3,1.3); tPitch=clamp(tPitch+dy*.003,-.3,.35); } }
  function update(dt,t){
    waves(t);
    hearts.userData.update(dt,t);
    boats.forEach(function(b,i){ b.position.x+=b.userData.sp*dt; if(b.position.x>150) b.position.x=-150; b.position.y=.6+Math.sin(t*1.2+i)*.5; b.rotation.z=Math.sin(t*1.1+i)*.06; });
    bulbs.forEach(function(b,i){ b.material.opacity=.7+Math.sin(t*2+i)*.25; });
    flame.scale.setScalar(.65+Math.sin(t*14)*.06); cl.intensity=.85+Math.sin(t*11)*.12;
    yaw=lerp(yaw,tYaw,.08); pitch=lerp(pitch,tPitch,.08);
    cam.position.set(Math.sin(t*.3)*.15,FY+1.75+Math.sin(t*.5)*.03,2);
    var dir=V3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
    cam.lookAt(cam.position.clone().add(dir));
    sky.position.copy(cam.position); stars.position.copy(cam.position);
  }
  var api={scene:scene,cam:cam,enter:enter,leave:leave,update:update,onMove:onMove};
  return api;
})();

/* =====================================================================
   App shell
   ===================================================================== */
var worlds={hub:hub,c4:c4,pizza:pz,sea:sea}, titles={hub:'A Date in pixels ',c4:'Date 1 · The café',pizza:'Date 2 · Pizza night',sea:'The final chapter'};
var active=null, current='';
function goWorld(name){
  if(active&&active.leave) active.leave();
  hideCard();
  active=worlds[name]; current=name;
  document.body.dataset.world=name;
  el.back.hidden=(name==='hub'); el.wtitle.textContent=titles[name]; el.stats.hidden=(name!=='hub'); el.reset.hidden=(name!=='hub');
  el.joy.hidden=true;
  if(active.enter) active.enter();
  resize();
}
function resize(){
  var w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  Object.keys(worlds).forEach(function(k){ var wd=worlds[k]; wd.cam.aspect=w/h; wd.cam.updateProjectionMatrix(); if(wd.resize) wd.resize(w/h); });
}
window.addEventListener('resize',resize);

/* pointer routing */
var ptr=null;
canvas.addEventListener('pointerdown',function(e){
  if(ptr||!active) return;
  audio();
  ptr={id:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,dragged:false};
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  if(active.onDown) active.onDown(e,ptr);
});
canvas.addEventListener('pointermove',function(e){
  if(!active) return;
  if(ptr&&ptr.id===e.pointerId){
    var dx=e.clientX-ptr.lx, dy=e.clientY-ptr.ly; ptr.lx=e.clientX; ptr.ly=e.clientY;
    if(Math.hypot(e.clientX-ptr.x0,e.clientY-ptr.y0)>8) ptr.dragged=true;
    if(active.onMove) active.onMove(e,ptr,dx,dy);
  } else if(!ptr && active.onHover){ active.onHover(e); }
});
function endPtr(e,cancel){
  if(ptr&&ptr.id===e.pointerId){ var p=ptr; ptr=null; if(cancel) p.dragged=true; if(active&&active.onUp) active.onUp(e,p); }
}
canvas.addEventListener('pointerup',function(e){ endPtr(e,false); });
canvas.addEventListener('pointercancel',function(e){ endPtr(e,true); });
canvas.addEventListener('wheel',function(e){ if(active===hub){ hub.setZoom(e.deltaY*.01); e.preventDefault(); } },{passive:false});

/* keyboard */
window.addEventListener('keydown',function(e){ if(active===hub && (e.target===document.body || e.target===canvas)){ hub.setKeys(e.code,true); if(e.code.indexOf('Arrow')===0) e.preventDefault(); } });
window.addEventListener('keyup',function(e){ hub.setKeys(e.code,false); });

/* joystick */
(function(){
  var id=null;
  function upd(e){
    var r=el.joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=e.clientX-cx, dy=e.clientY-cy, m=Math.hypot(dx,dy), max=r.width/2-10;
    if(m>max){ dx=dx/m*max; dy=dy/m*max; }
    el.knob.style.transform='translate('+dx+'px,'+dy+'px)';
    hub.joy.x=dx/max; hub.joy.y=-dy/max;
  }
  el.joy.addEventListener('pointerdown',function(e){ id=e.pointerId; el.joy.setPointerCapture(id); upd(e); });
  el.joy.addEventListener('pointermove',function(e){ if(e.pointerId===id) upd(e); });
  function end(e){ if(e.pointerId===id){ id=null; el.knob.style.transform=''; hub.joy.x=0; hub.joy.y=0; } }
  el.joy.addEventListener('pointerup',end); el.joy.addEventListener('pointercancel',end);
})();

/* top bar + intro */
el.back.addEventListener('click',function(){ goWorld('hub'); });
function paintMute(){ el.mute.textContent=state.muted?'♪̸':'♪'; el.mute.style.opacity=state.muted?.5:1; }
el.mute.addEventListener('click',function(){ state.muted=!state.muted; save(); paintMute(); audio(); });
var resetArmed=false, resetT=null;
el.reset.addEventListener('click',function(){
  if(!resetArmed){ resetArmed=true; toast('Tap ↺ again to reset your progress'); clearTimeout(resetT); resetT=setTimeout(function(){ resetArmed=false; },3000); return; }
  state.done={cafe:false,pizza:false}; save(); resetArmed=false; hub.refresh(); toast('Progress reset');
});
paintMute();
el.nameIn.value=state.name;
function begin(){
  audio();
  state.name=(el.nameIn.value||'').trim().slice(0,24); save();
  el.intro.classList.add('gone'); el.top.hidden=false;
  hub.refresh(); hub.begin(); sfx.chime();
  setTimeout(function(){ toast('Tap the glowing path, or use WASD and the joystick'); },3400);
}
el.begin.addEventListener('click',begin);
el.nameIn.addEventListener('keydown',function(e){ if(e.key==='Enter') begin(); });

/* main loop */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  if(active){ active.update(dt,now/1000); renderer.render(active.scene,active.cam); }
  requestAnimationFrame(frame);
}
goWorld('hub');
el.back.hidden=true;
requestAnimationFrame(frame);

})();
</script>
</body>
